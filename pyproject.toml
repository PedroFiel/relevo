[project]
name = "relevo-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/pipeline", "apps/api"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "jupyter>=1.0", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/api/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/pipeline/tests", "apps/api/tests"]
