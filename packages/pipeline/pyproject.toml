[project]
name = "relevo-pipeline"
version = "0.1.0"
description = "Pipeline de computação gráfica do RELEVO: 3 fotos -> visual hull -> malha 3D (sem IA)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "trimesh>=4.4",
  "fast-simplification>=0.1.7",
  "xatlas>=0.0.9",
  "pillow>=10",
]

[project.scripts]
relevo-pipeline = "relevo_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relevo_pipeline"]
