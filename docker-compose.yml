# Infra local do RELEVO. Subir com: make db-up  (ou: docker compose up -d)
services:
  postgres:
    image: postgres:16-alpine
    container_name: relevo-postgres
    environment:
      POSTGRES_USER: relevo
      POSTGRES_PASSWORD: relevo
      POSTGRES_DB: relevo
    ports:
      - "5432:5432"
    volumes:
      - relevo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevo"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: relevo-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: relevo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - relevo-minio:/data

volumes:
  relevo-pgdata:
  relevo-minio:
